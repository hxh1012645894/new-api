name: Build and push Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test-backend:
    name: Run backend verification tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test backend
        run: |
          mkdir -p web/dist
          touch web/dist/index.html
          go test ./common/... ./controller/... ./middleware/...
          cd relaykit && GOWORK=off go build ./...

  test-frontend:
    name: Run frontend verification tests (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      # Every shard must report, so a failure in one cannot hide the others.
      fail-fast: false
      matrix:
        shard: ['1', '2', '3']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('web/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install
        working-directory: web
        run: bun install --frozen-lockfile

      # Typecheck covers the whole project, so it runs in one shard only.
      - name: Typecheck
        if: matrix.shard == '1'
        working-directory: web
        run: bun run typecheck

      - name: Test frontend
        working-directory: web
        run: bun run test --shard=${{ matrix.shard }}/3

  build:
    name: Build and push Docker image
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract short commit SHA
        id: vars
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:${{ steps.vars.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Make package public
        run: |
          PACKAGE="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          gh api --method PATCH "user/packages/container/$PACKAGE" -f visibility=public || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
